name: 📸 Instagram Downloader (Public)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'عملیات'
        required: true
        type: choice
        options:
          - download
          - delete-all
      url:
        description: 'آدرس پست، ریلز یا استوری (فقط برای دانلود)'
        required: false
        type: string
      type:
        description: 'نوع محتوا (فقط برای دانلود)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - video-only
          - images-only
      save_in_new_branch:
        description: 'ذخیره در یک شاخهٔ جدید (شاخهٔ اصلی را شلوغ نمی‌کند)'
        required: false
        default: false
        type: boolean

jobs:
  instagram-manager:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ========== کش و راه‌اندازی (فقط برای دانلود) ==========
      - name: Cache WARP Docker image
        id: cache-warp
        if: github.event.inputs.action == 'download'
        uses: actions/cache@v4
        with:
          path: warp-image.tar
          key: warp-image-${{ runner.os }}-v1

      - name: Load or pull WARP image
        if: github.event.inputs.action == 'download'
        run: |
          if [ -f warp-image.tar ]; then
            echo "🔄 Loading WARP image from cache..."
            docker load < warp-image.tar
          else
            echo "⬇️ Pulling WARP image..."
            docker pull caomingjun/warp
            docker save caomingjun/warp -o warp-image.tar
          fi

      - name: Start WARP Container
        if: github.event.inputs.action == 'download'
        run: |
          echo "🚀 Starting Cloudflare WARP container..."
          docker network create warp-net || true
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp
          echo "🔍 Checking WARP status (every second)..."
          for i in {1..30}; do
            sleep 1
            RESULT=$(curl -s --max-time 10 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "failed")
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "✅ WARP is active!"
              echo "$RESULT"
              break
            fi
          done
          FINAL=$(curl -s --max-time 10 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "failed")
          if echo "$FINAL" | grep -qE "warp=(on|plus)"; then
            echo "✅ WARP proxy is ready!"
          else
            echo "⚠️ WARP might not be fully active, but continuing anyway..."
          fi

      - name: Cache apt packages
        id: cache-apt
        if: github.event.inputs.action == 'download'
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-packages-${{ runner.os }}-v1

      - name: Install dependencies (download only)
        if: github.event.inputs.action == 'download'
        run: |
          if [ -d ~/apt-cache ]; then
            echo "📦 Using cached apt packages..."
            sudo cp ~/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip ffmpeg zip curl file
          mkdir -p ~/apt-cache
          sudo cp /var/cache/apt/archives/*.deb ~/apt-cache/
          sudo chmod 644 ~/apt-cache/*.deb

      - name: Cache pip
        id: cache-pip
        if: github.event.inputs.action == 'download'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-ytdlp-v1
          restore-keys: |
            pip-${{ runner.os }}-ytdlp-

      - name: Install yt-dlp
        if: github.event.inputs.action == 'download'
        run: pip3 install --upgrade yt-dlp

      # ========== دانلود ==========
      - name: Download Instagram Media
        if: github.event.inputs.action == 'download'
        run: |
          URL="${{ github.event.inputs.url }}"
          TYPE="${{ github.event.inputs.type }}"
          FOLDER_NAME="instagram"

          if [ -z "$URL" ]; then
            echo "❌ No URL provided."
            exit 1
          fi

          mkdir -p "$FOLDER_NAME" tmp_ig

          case "$TYPE" in
            "auto")         FORMAT="best";;
            "video-only")   FORMAT="bestvideo+bestaudio/best";;
            "images-only")  FORMAT="bestimage";;
            *)              FORMAT="best";;
          esac

          echo "📸 Downloading from Instagram..."
          yt-dlp \
            --proxy "socks5://127.0.0.1:1080" \
            --format "$FORMAT" \
            --output "tmp_ig/%(uploader)s - %(title).80s - %(id)s.%(ext)s" \
            --no-playlist --retries 10 --fragment-retries 10 \
            --user-agent "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36" \
            --no-check-certificates --write-info-json \
            "$URL" || {
              echo "❌ First attempt failed, trying with Instagram app user agent..."
              yt-dlp \
                --proxy "socks5://127.0.0.1:1080" --format "$FORMAT" \
                --output "tmp_ig/%(uploader)s - %(title).80s - %(id)s.%(ext)s" \
                --user-agent "Instagram 275.0.0.27.98 Android" "$URL"
            }

          # Validate and move files
          for FILE in tmp_ig/*; do
            [ -f "$FILE" ] || continue
            BASENAME=$(basename "$FILE")
            MIME=$(file --mime-type -b "$FILE")
            if [[ "$BASENAME" == *.json ]]; then
              mv "$FILE" "$FOLDER_NAME/$BASENAME"
            elif echo "$MIME" | grep -qE 'video/|image/|audio/'; then
              echo "✅ Valid media: $BASENAME"
              mv "$FILE" "$FOLDER_NAME/$BASENAME"
            elif echo "$MIME" | grep -q 'text/html'; then
              echo "❌ Error: HTML page – likely private or blocked"
              rm -f "$FILE"
            else
              echo "⚠️ Unknown type, moving anyway: $BASENAME"
              mv "$FILE" "$FOLDER_NAME/$BASENAME"
            fi
          done
          rm -rf tmp_ig
          echo "✅ Download complete. Files in $FOLDER_NAME/"

      # ========== حذف ==========
      - name: Delete all Instagram downloads
        if: github.event.inputs.action == 'delete-all'
        run: |
          if [ -d "instagram" ] && [ "$(ls -A instagram 2>/dev/null)" ]; then
            git rm -rf instagram/* 2>/dev/null || true
            echo "🗑️ All Instagram files marked for deletion."
          else
            echo "📂 Instagram folder already empty."
          fi

      # ========== ساخت README گالری ==========
      - name: Generate Instagram README
        if: github.event.inputs.action == 'download'
        run: |
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BRANCH="${GITHUB_REF_NAME}"
          BASE_URL="https://github.com/${REPO_OWNER}/${REPO_NAME}/raw/${BRANCH}/instagram"
          
          {
            echo "# 📸 دانلودهای اینستاگرام"
            echo ""
            echo "| نوع | فایل | پیش‌نمایش / پخش |"
            echo "|------|------|-----------------|"
            
            for FILE in instagram/*; do
              [ -f "$FILE" ] || continue
              BASENAME=$(basename "$FILE")
              EXT="${BASENAME##*.}"
              ENCODED_NAME=$(python3 -c "import urllib.parse; print(urllib.parse.quote('''$BASENAME'''))")
              RAW_URL="${BASE_URL}/${ENCODED_NAME}"
              
              if [[ "$EXT" == "mp4" || "$EXT" == "webm" ]]; then
                echo "| 🎬 Video | $BASENAME | [▶️ Watch](${RAW_URL}) |"
              elif [[ "$EXT" == "jpg" || "$EXT" == "jpeg" || "$EXT" == "png" || "$EXT" == "webp" ]]; then
                echo "| 🖼️ Image | $BASENAME | [👁️ View](${RAW_URL}) |"
              elif [[ "$EXT" == "mp3" ]]; then
                echo "| 🎵 Audio | $BASENAME | [🔊 Listen](${RAW_URL}) |"
              else
                echo "| 📄 | $BASENAME | [🔗 Open](${RAW_URL}) |"
              fi
            done
            
            echo ""
            echo "---"
            echo "*آخرین به‌روزرسانی: $(date '+%Y-%m-%d %H:%M:%S')*"
          } > instagram/README.md
          echo "✅ Instagram README generated"

      # ========== Commit & Push ==========
      - name: Commit and push changes
        if: always()
        run: |
          SAVE_IN_NEW_BRANCH="${{ github.event.inputs.save_in_new_branch }}"
          if [ "$SAVE_IN_NEW_BRANCH" == "true" ]; then
            BRANCH="insta-$(date +%Y%m%d-%H%M%S)-$(echo $RANDOM | md5sum | head -c 6)"
          else
            BRANCH="${GITHUB_REF_NAME}"
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f instagram/ 2>/dev/null || true

          if git diff --cached --quiet && git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Instagram Manager – ${{ github.event.inputs.action }} [skip ci]"
          git pull --rebase origin "$BRANCH" || true
          git push origin HEAD:"$BRANCH"
          echo "✅ Pushed to branch: $BRANCH"
